[package]
name = "parq"
version = "0.1.0"
description = "Open source partition manager for Windows."
authors = ["Parq contributors"]
license = "GPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.80"

[lib]
name = "parq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
# raw_io read 파운데이션의 SHA256 라운드트립 검증(example raw_read)이 hash-region.ps1 값과
# 대조하기 위해서만 사용. 프로덕션 lib(raw_io)은 해시 의존성 없이 유지(docs/v2-raw-io.md §5 설계).
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Windows API bindings — feature flags added per-module as needed.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",           # CreateFileW 의 SECURITY_ATTRIBUTES 파라미터 타입 (raw_io, read-only open)
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
wmi = "0.14"
