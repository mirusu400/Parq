[package]
name = "parq"
version = "0.1.0"
description = "Open source partition manager for Windows."
authors = ["Parq contributors"]
license = "GPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.80"

[lib]
name = "parq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hashing — V2 move 엔진의 체크섬 라운드트립(charter §3-7) 무결성 검증 + raw_io 검증. charter §6 승인.
sha2 = "0.10"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
# Windows API bindings — feature flags added per-module as needed.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",           # CreateFileW 의 SECURITY_ATTRIBUTES 파라미터 타입 (raw_io, read-only open)
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
wmi = "0.14"
